version: '3.9'
services:
  twitch_bot:  # NAME
    build:
      context: .
    container_name: twitch_bot # NAME
    stop_signal: SIGKILL
    ports:
      - 5014:5014 # PORTS
    networks:
      - webnet
    depends_on:
      - postgres
    volumes:
      - .:/telegram_bot
    environment:
      - LOCAL_ENV=prod

  postgres:
    image: postgres:17
    container_name: twitch_bot # NAME
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - webnet

networks:
  webnet:
